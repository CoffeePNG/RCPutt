# RCUI message catalog for RCPuttPutt (bundled defaults).
#
# Bundled catalogs are a flat message tree plus RCUI's metadata keys - here just the top-level
# 'prefix', shared by every message this bundle sends. RCUI writes the operator-facing split file
# itself (that is where schema-version and the messages: wrapper live) - do not add them here.
#
# Keeps the RC house format - the standard four-stop warm-to-cool gradient and the dark-gray
# guillemet.
#
# The label is RCPuttPutt, not RCPutt, and the length is deliberate: MiniMessage spreads a gradient
# across the CHARACTER COUNT, so a 6-character label samples between the stops and never actually
# shows the brand colours. At 10 characters the ramp lands on exactly the same hex values as the
# shared "RC Network" prefix - verified character by character. Renaming to a shorter word will
# silently shift every colour again.
#
# No legacy-prefixes key: that mechanism strips a prefix baked INLINE into message text during
# adoption, and RCPuttPutt never did that - its old prefix was always a separate setting, so there
# is nothing inline to strip.
prefix: '<gradient:#FF7F50:#DB7093:#9370DB:#87CEFA>RCPuttPutt</gradient> <#A9A9A9>»</#A9A9A9> '
putt:
  stroke: '<gray>Hole <white><hole></white> - stroke <white><strokes></white>.</gray>'
  still-rolling: '<red>Your ball is still rolling.</red>'
  no-round: '<red>You are not in a round. Try /puttputt start <course>.</red>'
  cannot-drop: '<red>You cannot drop your putter mid-round.</red>'
  sunk: '<green><result>!</green> <gray>Hole <white><hole></white> in <white><strokes></white> (par <par>).</gray>'
  knocked-in: '<green>Knocked in!</green> <gray>Someone put you in the cup on hole <white><hole></white> for <white><strokes></white>.</gray>'
  hazard: '<red>In the <surface>!</red> <gray>+<penalty> stroke(s).</gray>'
  out-of-bounds: '<red>Out of bounds!</red> <gray>+<penalty> stroke(s).</gray>'
power:
  title: '<yellow><player>''s power: <white><percent>%</white></yellow>'
  title-precise: '<aqua><player>''s power: <white><percent>%</white> <gray>(fine)</gray></aqua>'
turn:
  yours: '<green>Your turn!</green> <gray>Hold right-click to charge. <white><seconds>s</white> on the clock.</gray>'
  other: '<gray>Waiting on <white><player></white>...</gray>'
  not-yours: '<red>It is not your turn.</red>'
  order: '<gray>Order this hole: <white><order></white></gray>'
  clock: '<gray><bar></gray>  <white><tenths></white><gray>s</gray>'
  timeout: '<red>Out of time!</red> <gray>+<penalty> stroke(s).</gray>'
  capped: '<red>Maximum <strokes> strokes on this hole.</red>'
round:
  started: '<green>Round started on <white><display></white></green> <gray>- <holes> holes, par <par>.</gray>'
  hole-start: '<yellow>Hole <white><hole></white>, par <white><par></white>.</yellow>'
  player-finished: '<green>Round finished!</green> <gray><strokes> strokes (<diff>).</gray>'
  complete: '<green>Your round on <white><course></white> is over.</green>'
  left: '<gray>You left the round.</gray>'
  resumed: '<green>Resumed your round on <white><course></white></green> <gray>at hole <white><hole></white>.</gray>'
  not-playing: '<red>You are not in a round.</red>'
  already-playing: '<red>You are already in a round.</red>'
  not-leader: '<red>Only the party leader can do that.</red>'
  party-busy: '<red>Your party is already in another activity.</red>'
  member-busy: '<red><player> is already in a round.</red>'
  no-members: '<red>Nobody in your party is online.</red>'
  world-missing: '<red>That course''s world (<world>) is not loaded.</red>'
  course-incomplete: '<red>Course <course> has unfinished holes: <holes></red>'
scorecard:
  header: '<gold>Scorecard - <course></gold>'
  row: '<gray>Hole <white><hole></white> <dark_gray>|</dark_gray> par <white><par></white> <dark_gray>|</dark_gray> <white><strokes></white></gray>'
  total: '<gold>Total: <white><strokes></white> (<diff>)</gold>'
course:
  unknown: '<red>No course called <course>.</red>'
  none: '<gray>No playable courses yet.</gray>'
  list-header: '<gold>Courses</gold>'
  list-row: '<gray><dark_gray>-</dark_gray> <white><id></white> <dark_gray>|</dark_gray> <display> <dark_gray>|</dark_gray> <holes> holes, par <par></gray>'
leaderboard:
  header: '<gold>Leaderboard - <course></gold>'
  row: '<gray><white><rank>.</white> <player> <dark_gray>|</dark_gray> <white><strokes></white> (<diff>)</gray>'
  empty: '<gray>Nobody has finished <course> yet.</gray>'
  error: '<red>Could not read the leaderboard.</red>'
wand:
  given: '<green>Course wand given.</green> <gray>Left/right-click blocks for corners, <white>sneak</white>+left/right for tee/cup. Editing hole <white><hole></white>.</gray>'
  hole-selected: '<green>Wand now edits hole <white><hole></white>.</green>'
  corner: '<green>Corner <corner></green> <gray>at <x>, <y>, <z>. Both set: <white><ready></white></gray>'
  tee: '<green>Tee for hole <white><hole></white></green> <gray>set to <x>, <y>, <z>.</gray>'
  cup: '<green>Cup for hole <white><hole></white></green> <gray>set to <x>, <y>, <z>.</gray>'
  wrong-world: '<red>That course lives in world <world>.</red>'
  no-permission: '<red>You do not have permission to build courses.</red>'
check:
  header: '<gold>Check: course <white><course></white>, hole <white><hole></white></gold>'
  incomplete: '<red>Hole is incomplete.</red> <gray>tee=<tee> cup=<cup> bounds=<bounds></gray>'
  ground: '<gray>  floor <white><mapping></white> x<count></gray>'
  walls: '<gray>  wall blocks at ball height: <white><count></white></gray>'
  no-walls: '<red>  No walls found at y=<y>.</red> <gray>Walls must sit one block ABOVE the green, and their material must be mapped to a wall surface.</gray>'
  unmapped: '<yellow>  <material> x<count> is at ball height but is NOT mapped</yellow> <gray>- the ball rolls through it. Map it with /puttputt admin surface <material> wall</gray>'
admin:
  course-created: '<green>Created course <white><course></white> in world <white><world></white>.</green>'
  course-exists: '<red>Course <course> already exists.</red>'
  course-selected: '<green>Editing course <white><course></white>.</green>'
  course-deleted: '<green>Deleted course <course>.</green>'
  course-in-use: '<red>Course <course> has a round in progress.</red>'
  no-course-selected: '<red>Select a course first: /puttputt admin select <course></red>'
  tee-set: '<green>Tee for hole <hole> set to your position.</green>'
  cup-set: '<green>Cup for hole <hole> set to your position.</green>'
  par-set: '<green>Hole <hole> is now par <par>.</green>'
  corner-set: '<green>Corner <corner> set to <x>, <y>, <z>.</green>'
  bounds-set: '<green>Bounds for hole <white><hole></white> set from your selection.</green> <gray><min> to <max></gray>'
  bounds-from-fill: '<green>Bounds for hole <white><hole></white> traced from the tee.</green> <gray><cells> blocks of fairway, <min> to <max></gray>'
  bounds-tee-blocked: '<red>The tee is not on open ground.</red> <gray>Set the tee on the fairway first, then run setbounds.</gray>'
  bounds-leaked: '<red>The boundary leaks.</red> <gray>The trace ran past <cells> blocks without closing. Check for a gap in your <material>.</gray>'
  bounds-from-markers: '<green>Bounds for hole <white><hole></white> set from <white><count></white> <material> markers.</green> <gray><min> to <max></gray>'
  bounds-one-marker: '<red>Only one <material> found.</red> <gray>Place at least two, at opposite corners of the hole.</gray>'
  bounds-none: '<red>No bounds set.</red> <gray>Place two <material> blocks at opposite corners (searched <radius> blocks), or use pos1/pos2.</gray>'
  no-selection: '<red>Set both corners first: /puttputt admin pos1 and pos2.</red>'
  no-such-hole: '<red>Hole <hole> does not exist on this course.</red>'
  hole-deleted: '<green>Deleted hole <hole>.</green>'
  unknown-material: '<red>Unknown material <material>.</red>'
  unknown-surface: '<red>Unknown surface <surface>.</red>'
  teleport-added: '<green>Teleport on hole <white><hole></white>:</green> <gray><from> -> <to> (<mode>).</gray>'
  teleports-cleared: '<green>Cleared <white><count></white> teleport(s) on hole <white><hole></white>.</green>'
  surface-global: '<green>Mapped <material> to <surface> globally.</green>'
  surface-hole: '<green>Mapped <material> to <surface> on hole <hole>.</green>'
  saved: '<green>Courses saved.</green>'
  save-failed: '<red>Could not save courses - see console.</red>'
  reloaded: '<green>Config and courses reloaded.</green>'
  info: '<gray>Parties: <white><parties></white> <dark_gray>|</dark_gray> courses: <white><courses></white> <dark_gray>|</dark_gray> active rounds: <white><rounds></white> <dark_gray>|</dark_gray> economy:
    <white><economy></white></gray>'

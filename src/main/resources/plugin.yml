name: RCPuttPutt
version: '${project.version}'
main: com.redcoffee.puttputt.RCPuttPuttPlugin
api-version: '1.21.11'
description: Playable putt-putt with rolling-ball physics, configurable surfaces, party rounds and leaderboards.
authors: [RedCoffee]
depend: [RCParties]
# Resolved by Paper at load time rather than shaded.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3
softdepend: [Vault]
permissions:
  rcputtputt.play:
    description: Play putt-putt and view courses, scorecards and leaderboards.
    default: true
  rcputtputt.admin:
    description: Build and manage courses.
    default: op

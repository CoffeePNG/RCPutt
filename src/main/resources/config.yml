# Bumped by the plugin when it migrates your file; do not edit by hand.
config-version: 4

# RCPuttPutt - RC-SPEC-PUTTPUTT-001
# Everything a course designer needs to tune lives here. Surfaces are a registry, so new hazards,
# bumpers and pads are config entries rather than code.

physics:
  # Blocks per tick. MUST stay below 1.0: a ball that travels more than a block between samples can
  # step straight over a 1-block wall without ever testing it. This cap is the tunneling guard.
  max_velocity: 0.9
  # Below this speed the ball stops and the next stroke is allowed.
  rest_epsilon: 0.02
  # Over the cup faster than this and the ball lips out instead of dropping.
  max_sink_speed: 0.25
  # Blocks from the cup centre that count as "over the cup".
  sink_radius: 0.35
  # Velocity of a fully drawn putt. Clamped to max_velocity.

surfaces:
  green:
    friction: 0.92          # baseline roll
  sand:
    friction: 0.75          # heavy drag - the ball bogs down and can get stuck
  ice:
    friction: 0.99          # slick - overshoot risk
  wall:
    type: wall
    restitution: 0.70       # bounce energy retained
  water:
    type: hazard
    penalty: 1              # strokes added on entry
    reset: last_rest        # last_rest | tee
  booster_north:
    type: impulse
    impulse:
      direction: [0, 0, -1] # world-space vector; normalised on load
      strength: 0.35
  booster_south:
    type: impulse
    impulse:
      direction: [0, 0, 1]
      strength: 0.35
  booster_east:
    type: impulse
    impulse:
      direction: [1, 0, 0]
      strength: 0.35
  booster_west:
    type: impulse
    impulse:
      direction: [-1, 0, 0]
      strength: 0.35
  cup:
    type: hole
  # Rivers: a wide, sustained flow. preventRest keeps the ball drifting instead of parking
  # mid-stream - it only settles once it leaves the current.
  river_east:
    type: current
    current:
      direction: [1, 0, 0]
      strength: 0.12
    preventRest: true
  river_north:
    type: current
    current:
      direction: [0, 0, -1]
      strength: 0.12
    preventRest: true

# Block material -> surface id. Per-course overrides live in the course file and win over this map.
# Anything unmapped rolls like plain green.
material_map:
  GREEN_TERRACOTTA: green
  GREEN_CONCRETE: green
  SAND: sand
  BLUE_ICE: ice
  SMOOTH_STONE: wall
  WATER: water
  LIGHT_BLUE_CONCRETE: booster_north
  ORANGE_CONCRETE: booster_east
  CYAN_CONCRETE: river_east
  LIGHT_GRAY_CONCRETE: river_north

# Ball-to-ball collision. Affordable because play is turn-based: only one ball is ever under power,
# so a strike resolves against resting balls rather than an n-body simulation.
ball-collision:
  enabled: true
  restitution: 0.85       # fraction of normal velocity handed to the struck ball
  radius: 0.18            # ball radius in blocks; contact happens at twice this
  allow-knock-in: true    # false = purists; a knocked-in ball is put back instead of counting

turn-order:
  # ascending  = lowest total putts FIRST. This is a deliberate penalty: the leader reads the green
  #              for everyone with no information of their own, which keeps rounds close.
  # descending = reward the leader instead.
  mode: ascending

shot-clock:
  seconds: 30
  timeout-penalty: 1
  max-consecutive-timeouts: 3   # after this many forfeits in a row, the player is capped out

# Hard cap so one player cannot stall a hole forever.
max-strokes-per-hole: 10

power-meter:
  # oscillate = bar sweeps 0 -> 100 -> 0 while held; release locks it in (timing skill).
  # fill      = bar rises to full and holds; release fires at the current value.
  mode: oscillate
  sweep-ticks: 30         # ticks for one 0 -> 100 pass
  # Hold SNEAK while charging to crawl the meter, for dialling in a short putt.
  # 0.35 = about a third of normal speed. 1.0 disables the fine mode.
  sneak-rate: 0.35
  min-velocity: 0.08
  max-velocity: 0.9       # clamped to physics.max_velocity

snapshot:
  interval-seconds: 15
  resume-window-minutes: 10

bounds:
  # HOW A HOLE IS BOUNDED
  #
  # /puttputt admin setbounds traces the fairway outward from the tee and stops at these materials,
  # so the boundary follows whatever shape you built - L-shaped, spiral, doubling back on itself.
  # A bounding box cannot describe a course that bends, which is why tracing beats corners.
  #
  # Anything already mapped to a wall surface also stops the trace, as does a missing floor, so an
  # unfenced drop bounds a hole just as a wall does.
  boundary-materials:
    - SMOOTH_STONE_SLAB
  max-cells: 40000       # safety limit; hitting it means a gap in the boundary, not a big hole
  # How far the trace follows a drop. A fairway that falls over a ledge into a lower green is still
  # one hole, so the trace steps down with it. Only downward: a ball rolls off a ledge, never up
  # one, and a trace that climbed would escape over the hole's own walls. 0 keeps it on one layer.
  max-drop: 8
  # How far above and below the stored tee to look for the ball's own plane before tracing. /settee
  # records your feet, so standing on a slab, stair or carpet stores a tee half a block high, and a
  # tee set while stood on the boundary wall is a block high; without this the trace would start in
  # solid rock or thin air and return nothing at all, whatever your boundary material is.
  start-search: 3

  # Fallback only, for a hole with no tee set yet: two of these at opposite corners give a box.
  marker-material: AMETHYST_BLOCK
  scan-radius: 64        # blocks searched around you; capped at 128
  height-padding: 4      # headroom added above the highest marker, so walls sit inside the box

  # true  = a hole's bounds are a hard boundary. Blocks outside the region read as wall, so a ball
  #         physically cannot leave a course - and, more to the point, the physics can never read a
  #         block that is not part of the hole. Terracotta, sand or water elsewhere on your server
  #         is completely inert.
  # false = sample the world freely and rely on the out-of-bounds reset below instead.
  confine: true

out_of_bounds:
  # Strokes added when a ball leaves the hole's bounds. With bounds.confine on this is a safety net
  # rather than the usual path.
  penalty: 1

leaderboard:
  size: 10

courses:
  # Course edits are held in memory while you build, and written out this often. /puttputt admin save
  # (or /ppa save) still writes immediately; this is the safety net, so a crash or a /stop before you
  # remember to save does not cost you the hole. Courses are also written on shutdown and before a
  # reload, and only files whose content actually changed are touched.
  autosave-seconds: 60

economy:
  # v1 seam only. Entry fees and payouts are stubbed until the Vault integration lands.
  enabled: false

items:
  ball:
    material: SNOWBALL
    name: '<white>Golf Ball</white>'
    # custom_model_data, NOT item_model: LabyMod and some other clients render custom_model_data
    # reliably but ignore item_model overrides.
    custom_model_data: 1001.0
  putter:
    # A shovel, not a bow: the plugin owns the charge curve via the boss bar power meter.
    material: IRON_SHOVEL
    name: '<gold>Putter</gold>'
    custom_model_data: 1002.0
  wand:
    # Course-builder wand: /puttputt admin wand
    material: BLAZE_ROD
    name: '<light_purple>Course Wand</light_purple>'
    custom_model_data: 1003.0


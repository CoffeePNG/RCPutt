name: RCPuttPutt
version: '${project.version}'
main: com.redcoffee.puttputt.RCPuttPuttPlugin
loader: com.redcoffee.puttputt.loader.RCPuttPuttLoader
api-version: '26.2'
description: Turn-based putt-putt with rolling-ball physics, configurable surfaces, party rounds and leaderboards.
authors: [CoffeePNG]
website: https://github.com/CoffeePNG/RCPutt

dependencies:
  server:
    RCParties:
      load: BEFORE
      required: true
      join-classpath: true
    RCUI:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  rcputtputt.play:
    description: Play putt-putt and view courses, scorecards and leaderboards.
    default: true
  rcputtputt.admin:
    description: Build and manage courses.
    default: op
